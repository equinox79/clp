[package]
name = "clp"
version = "0.1.2"
edition = "2021"

[lib]
name = "clp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.1"
toml = "1.2.1"
unicode-normalization = "0.1.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2 = "0.6.5"
