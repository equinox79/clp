name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # v* タグのときは GitHub Releases に成果物と latest.json（アプリ内アップデート用）を載せる
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (and release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: clp ${{ github.ref_name }}
          releaseBody: "更新内容は下の変更履歴を参照してください。インストール・更新の方法は README を参照。"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

      - name: Attach portable clp.exe to release
        if: matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" src-tauri/target/release/clp.exe --clobber

      - name: Upload (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: clp-windows
          path: |
            src-tauri/target/release/clp.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload (macOS)
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: clp-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
