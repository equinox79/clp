<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="head">
    <input id="q" type="text" data-i18n-ph="search.ph" placeholder="" autocomplete="off" spellcheck="false" autofocus>
    <span id="paused" hidden data-i18n-title="paused.tip" data-i18n="paused"></span>
    <div id="tabs"><span id="t-history" class="on" data-i18n="tab.history"></span><span id="t-snippets" data-i18n="tab.snippets"></span></div>
  </div>
  <div id="list"></div>
  <pre id="preview"></pre>
  <div id="hint"></div>
</div>
<script src="platform.js"></script>
<script src="i18n.js"></script>
<script src="themes.js"></script>
<script src="main.js"></script>
</body>
</html>
