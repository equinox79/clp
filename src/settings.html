<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>clp</title>
<style>
:root { --bg:#fbfbfc; --fg:#1d1d1f; --sub:#6e6e73; --line:#e2e2e6; --sel:#e6efff; --mark:#ffe58a; --accent:#2f6df6; --err:#d33; }
@media (prefers-color-scheme: dark) { :root { --bg:#232326; --fg:#ececee; --sub:#9a9aa2; --line:#38383d; --sel:#2f3d5c; --mark:#6b5a12; --accent:#6c9bff; --err:#ff7b7b; } }
* { box-sizing: border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font:14px/1.5 "Yu Gothic UI","Segoe UI",sans-serif; display:grid; grid-template-columns:190px 1fr; overflow:hidden; }
/* sidebar */
nav { border-right:1px solid var(--line); padding:18px 10px; display:flex; flex-direction:column; gap:2px; background:color-mix(in srgb, var(--fg) 3%, var(--bg)); }
nav .brand { font-weight:700; font-size:15px; padding:0 10px 14px; display:flex; align-items:center; gap:8px; }
nav .brand i { width:22px; height:22px; border-radius:50%; background:var(--accent); display:inline-block; }
nav button { all:unset; cursor:pointer; padding:8px 12px; border-radius:8px; display:flex; gap:10px; align-items:center; color:var(--sub); }
nav button:hover { background:color-mix(in srgb, var(--fg) 7%, transparent); color:var(--fg); }
nav button.on { background:var(--sel); color:var(--fg); font-weight:600; }
/* content */
main { overflow-y:auto; padding:24px 28px 30px; }
section { display:none; max-width:560px; } section.on { display:block; }
section.wide { max-width:none; height:100%; }
h1 { font-size:18px; margin:0 0 16px; }
.card { border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
.card h3 { margin:0 0 2px; font-size:13px; }
.card p { margin:0 0 10px; font-size:12px; color:var(--sub); }
.card .row:last-child { margin-bottom:0; }
.row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.row .grow { flex:1; }
input[type=text], input[type=number], textarea { background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; outline:none; }
input:focus, textarea:focus { border-color:var(--accent); }
input[type=number] { width:110px; }
button.btn { padding:6px 13px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; font:inherit; }
button.btn:hover { background:color-mix(in srgb, var(--fg) 6%, transparent); }
button.btn.pri { background:var(--accent); border-color:var(--accent); color:var(--accent-fg,#fff); }
button.btn.danger { color:var(--err); border-color:color-mix(in srgb, var(--err) 50%, var(--line)); }
button.btn:disabled { opacity:.4; cursor:default; }
#hk { width:100%; text-align:center; font-size:16px; cursor:pointer; caret-color:transparent; }
#hk.rec { border-color:var(--accent); outline:2px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.msg { min-height:18px; font-size:12px; color:var(--sub); } .msg.err { color:var(--err); }
.seg { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.seg label { border:2px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center; cursor:pointer; font-size:12px; display:block; }
.seg label.on { border-color:var(--accent); background:var(--sel); }
.seg input { display:none; } .seg b { display:block; font-size:20px; font-weight:400; }
/* switch */
.sw { position:relative; width:42px; height:24px; flex:none; }
.sw input { opacity:0; width:0; height:0; }
.sw span { position:absolute; inset:0; background:color-mix(in srgb, var(--fg) 25%, transparent); border-radius:12px; transition:.15s; cursor:pointer; }
.sw span::after { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
.sw input:checked + span { background:var(--accent); } .sw input:checked + span::after { transform:translateX(18px); }
/* themes */
#themes { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.th { border:2px solid var(--line); border-radius:10px; padding:8px; cursor:pointer; font-size:12px; text-align:center; }
.th.on { border-color:var(--accent); }
.th .sample { height:54px; border-radius:6px; margin-bottom:6px; padding:7px; border:1px solid rgba(128,128,128,.25); text-align:left; font-size:10px; line-height:1.3; overflow:hidden; }
.th .sample .l1 { display:flex; align-items:center; gap:4px; font-weight:700; } .th .sample .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.th .sample .l2 { margin-top:3px; padding:1px 4px; border-radius:3px; }
/* snippets */
#snip { display:grid; grid-template-columns:230px 1fr; gap:14px; height:calc(100% - 92px); min-height:380px; }
#slist { border:1px solid var(--line); border-radius:12px; overflow-y:auto; padding:6px; }
.si { display:flex; gap:8px; align-items:center; padding:7px 8px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
.si.on { background:var(--sel); } .si.over { border-color:var(--accent); }
.si .n { width:16px; text-align:right; font-size:11px; color:var(--sub); flex:none; }
.si .t { flex:1; min-width:0; } .si .t b { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.si .t small { display:block; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#sed { display:flex; flex-direction:column; gap:8px; min-height:0; }
#sbody { flex:1; resize:none; font-family:"Cascadia Mono",Consolas,"Yu Gothic UI",monospace; font-size:13px; min-height:140px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--sub); }
.chip { padding:2px 9px; border:1px solid var(--line); border-radius:10px; cursor:pointer; color:var(--fg); font-family:Consolas,monospace; }
.chip:hover { background:var(--sel); }
.bar { display:flex; gap:8px; align-items:center; }
.empty { color:var(--sub); text-align:center; padding:40px 10px; }
.banner { border:1px solid var(--err); color:var(--err); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:12px; white-space:pre-wrap; }
select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; }
.krow { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.krow:last-child { border-bottom:0; }
.krow .lab { width:220px; flex:none; }
.krow .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.kc { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:8px; padding:2px 4px 2px 8px; }
.kc b { cursor:pointer; color:var(--sub); padding:0 4px; font-weight:400; } .kc b:hover { color:var(--err); }
.krow .add { padding:2px 10px; } .krow .add.rec { border-color:var(--accent); outline:2px solid color-mix(in srgb, var(--accent) 40%, transparent); }
kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 6px; font:12px Consolas,monospace; }
table { border-collapse:collapse; width:100%; } td { padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; } td:first-child { width:150px; }
</style>
</head>
<body>
<nav>
  <div class="brand"><i></i>clp</div>
  <button data-p="general" class="on">⚙ <span data-i18n="nav.general"></span></button>
  <button data-p="look">🎨 <span data-i18n="nav.look"></span></button>
  <button data-p="keys">⌨ <span data-i18n="nav.keys"></span></button>
  <button data-p="snip">📝 <span data-i18n="nav.snip"></span></button>
  <button data-p="hist">🗂 <span data-i18n="nav.hist"></span></button>
  <button data-p="about">ℹ <span data-i18n="nav.about"></span><span class="dot" hidden> ●</span></button>
</nav>
<main>

<section id="p-general" class="on">
  <h1 data-i18n="gen.title"></h1>
  <div class="card">
    <h3 data-i18n="gen.hk_h"></h3>
    <p data-i18n="gen.hk_p"></p>
    <input id="hk" type="text" readonly>
    <div class="row" style="margin-top:10px"><button class="btn" id="hkreset"></button><span class="msg" id="hkmsg"></span></div>
  </div>
  <div class="card">
    <h3 data-i18n="gen.pos_h"></h3>
    <p data-i18n="gen.pos_p"></p>
    <div class="seg" id="pos">
      <label><input type="radio" name="pos" value="center"><b>🖥</b><span data-i18n="gen.pos_center"></span></label>
      <label><input type="radio" name="pos" value="mouse"><b>🖱</b><span data-i18n="gen.pos_mouse"></span></label>
      <label><input type="radio" name="pos" value="caret"><b>⌨</b><span data-i18n="gen.pos_caret"></span></label>
    </div>
  </div>
  <div class="card">
    <div class="row"><div class="grow"><h3 data-i18n="gen.auto_h"></h3><p style="margin:0" data-i18n="gen.auto_p"></p></div>
      <label class="sw"><input type="checkbox" id="auto"><span></span></label></div>
    <div class="msg" id="automsg"></div>
  </div>
  <div class="card">
    <div class="row"><div class="grow"><h3 data-i18n="gen.blur_h"></h3><p style="margin:0" data-i18n="gen.blur_p"></p></div>
      <label class="sw"><input type="checkbox" id="blur"><span></span></label></div>
  </div>
  <div class="card">
    <h3 data-i18n="gen.lang_h"></h3>
    <p data-i18n-html="gen.lang_p"></p>
    <div class="row"><select id="lang" class="grow"></select><button class="btn" id="opendir2" data-i18n="about.open"></button></div>
  </div>
</section>

<section id="p-look">
  <h1 data-i18n="look.title"></h1>
  <div class="card"><h3 data-i18n="look.theme_h"></h3><p data-i18n="look.theme_p"></p><div id="themes"></div></div>
  <div class="card"><h3 data-i18n="look.fs_h"></h3><p data-i18n="look.fs_p"></p>
    <select id="fontsize"><option value="12" data-i18n="look.fs_s"></option><option value="14" data-i18n="look.fs_m"></option><option value="16" data-i18n="look.fs_l"></option><option value="18" data-i18n="look.fs_xl"></option></select>
  </div>
  <div class="card">
    <div class="row"><div class="grow"><h3 data-i18n="look.shadow_h"></h3><p style="margin:0" data-i18n="look.shadow_p"></p></div>
      <label class="sw"><input type="checkbox" id="fxshadow"><span></span></label></div>
    <div class="row" style="margin-top:12px"><div class="grow"><h3 data-i18n="look.glass_h"></h3><p style="margin:0" data-i18n="look.glass_p"></p></div>
      <label class="sw"><input type="checkbox" id="fxglass"><span></span></label></div>
  </div>
</section>

<section id="p-keys">
  <h1 data-i18n="keys.title"></h1>
  <div class="card">
    <h3 data-i18n="keys.win_h"></h3>
    <p data-i18n="keys.win_p"></p>
    <div id="keyrows"></div>
    <div class="row" style="margin:12px 0 0"><button class="btn" id="keyreset" data-i18n="keys.reset"></button><span class="msg" id="keymsg"></span></div>
  </div>
  <div class="card">
    <h3 data-i18n="keys.quick_h"></h3>
    <div class="row"><span class="grow"><span data-i18n="keys.quick_l"></span><br><small style="color:var(--sub)" id="qsub"></small></span><select id="quickmod"></select></div>
    <div class="row"><span class="grow" data-i18n="keys.bare"></span><label class="sw"><input type="checkbox" id="bare"><span></span></label></div>
  </div>
</section>

<section id="p-snip" class="wide">
  <h1><span data-i18n="snip.title"></span> <span class="msg" id="scount" style="font-weight:400;margin-left:8px"></span></h1>
  <div id="sbanner"></div>
  <div id="snip">
    <div style="display:flex;flex-direction:column;gap:8px;min-height:0">
      <div id="slist"></div>
      <div class="bar"><button class="btn pri" id="sadd" data-i18n="snip.add"></button><span class="msg" id="sstat" style="margin-left:auto"></span></div>
    </div>
    <div id="sed"></div>
  </div>
</section>

<section id="p-hist">
  <h1 data-i18n="hist.title"></h1>
  <div class="card">
    <h3 data-i18n="hist.lim_h"></h3>
    <p data-i18n="hist.lim_p"></p>
    <div class="row"><span class="grow" data-i18n="hist.max_items"></span><input type="number" id="maxitems" min="50" max="100000" step="100"> <span data-i18n="hist.unit_items"></span></div>
    <div class="row"><span class="grow" data-i18n="hist.max_kb"></span><input type="number" id="maxkb" min="1" max="20000" step="64"> KB</div>
    <div class="msg" id="limmsg"></div>
  </div>
  <div class="card">
    <h3 data-i18n="hist.excl_h"></h3>
    <p id="exptxt"></p>
    <textarea id="excl" rows="4" spellcheck="false" style="width:100%;font:13px Consolas,monospace;box-sizing:border-box;background:transparent;color:inherit;border:1px solid var(--line);border-radius:6px;padding:6px"></textarea>
    <div class="row" style="flex-wrap:wrap;gap:6px"><span data-i18n="hist.recent"></span><span id="recent" style="display:contents"></span></div>
    <div class="msg" id="exmsg"></div>
  </div>
  <div class="card">
    <h3 data-i18n="hist.clear_h"></h3>
    <p id="clrp"></p>
    <button class="btn danger" id="clear" data-i18n="hist.clear_btn"></button> <span class="msg" id="clrmsg"></span>
  </div>
</section>

<section id="p-about">
  <h1 data-i18n="about.title"></h1>
  <div class="card"><h3 data-i18n="about.upd_h"></h3>
    <p id="verp"></p>
    <div class="row"><button class="btn" id="chk" data-i18n="about.chk"></button><button class="btn pri" id="upd" style="display:none" data-i18n="about.upd_now"></button></div>
    <div class="msg" id="updmsg"></div>
    <pre id="notes" style="display:none;margin:8px 0 0;max-height:120px;overflow:auto;font:12px/1.5 inherit;white-space:pre-wrap;color:var(--sub);user-select:text"></pre>
    <div class="row" style="margin:12px 0 0"><span class="grow" data-i18n="about.autochk"></span><label class="sw"><input type="checkbox" id="autochk"><span></span></label></div>
  </div>
  <div class="card"><h3 data-i18n="about.bk_h"></h3>
    <p data-i18n="about.bk_p"></p>
    <div class="row"><button class="btn" id="exp" data-i18n="about.export"></button><button class="btn" id="imp" data-i18n="about.import"></button></div>
    <div class="msg" id="bkmsg"></div>
  </div>
  <div class="card"><h3 data-i18n="about.dir_h"></h3><p id="dir" style="user-select:text"></p><button class="btn" id="opendir" data-i18n="about.open"></button></div>
</section>

</main>
<script src="platform.js"></script>
<script src="i18n.js"></script>
<script src="themes.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const say = (el, t, err) => { el.textContent = t; el.classList.toggle('err', !!err); };
let S = {};

/* ---------- nav ---------- */
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach((s) => s.classList.toggle('on', s.id === 'p-' + b.dataset.p));
  if (b.dataset.p === 'snip') loadSnips();
  if (b.dataset.p === 'hist') refreshCount();
}));

/* ---------- general ---------- */
function keyName(e) {
  const c = e.code;
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit[0-9]$/.test(c)) return c.slice(5);
  if (/^(F[0-9]{1,2}|Space|Enter|Tab|Backquote|Minus|Equal|Comma|Period|Slash|Semicolon|Quote|BracketLeft|BracketRight|Backslash|Insert|Delete|Home|End|PageUp|PageDown)$/.test(c)) return c;
  if (/^Arrow/.test(c)) return c.slice(5);
  return null;
}
async function applyHotkey(hk) {
  try { await invoke('set_hotkey', { hotkey: hk }); $('hk').value = fmtHotkey(hk); say($('hkmsg'), t('common.saved')); }
  catch (err) { say($('hkmsg'), String(err), true); $('hk').value = fmtHotkey((await invoke('get_settings')).hotkey); }
}
$('hk').addEventListener('focus', () => { $('hk').classList.add('rec'); say($('hkmsg'), t('gen.press')); });
$('hk').addEventListener('blur', () => $('hk').classList.remove('rec'));
$('hk').addEventListener('keydown', (e) => {
  e.preventDefault();
  if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
  const k = keyName(e);
  const mods = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Super'].filter(Boolean);
  if (!k) return say($('hkmsg'), t('gen.badkey'), true);
  if (!mods.length) return say($('hkmsg'), t('gen.needmod', { mods: modsHelp() }), true);
  applyHotkey([...mods, k].join('+')); $('hk').blur();
});
$('hkreset').addEventListener('click', () => applyHotkey('Ctrl+Alt+V'));
$('pos').addEventListener('change', (e) => {
  invoke('set_position', { position: e.target.value });
  document.querySelectorAll('#pos label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked));
});
$('auto').addEventListener('change', async () => {
  try { await invoke('set_autostart', { enabled: $('auto').checked }); say($('automsg'), t('common.saved')); }
  catch (err) { say($('automsg'), String(err), true); $('auto').checked = !$('auto').checked; }
});

/* ---------- UI options ---------- */
const UI = { closeOnBlur: true, fontSize: 14 };
const saveUI = () => invoke('set_ui', { closeOnBlur: UI.closeOnBlur, fontSize: UI.fontSize });
$('blur').addEventListener('change', () => { UI.closeOnBlur = $('blur').checked; saveUI(); });
$('fontsize').addEventListener('change', () => { UI.fontSize = Number($('fontsize').value); saveUI(); });
const saveFx = () => invoke('set_effects', { shadow: $('fxshadow').checked, glass: $('fxglass').checked });
$('fxshadow').addEventListener('change', saveFx);
$('fxglass').addEventListener('change', saveFx);

/* ---------- keys ---------- */
let K = null, capturing = null;
const keymsg = (t, err) => say($('keymsg'), t, err);
const QM_NAME = IS_MAC
  ? { Ctrl: '⌃ Control', Alt: '⌥ Option', Shift: '⇧ Shift', Super: '⌘ Command' }
  : { Ctrl: 'Ctrl', Alt: 'Alt', Shift: 'Shift', Super: 'Win' };

function saveKeys() {
  return invoke('set_keys', { keys: K }).then(() => keymsg(t('common.saved')), (err) => keymsg(String(err), true));
}
function drawKeys() {
  if (!K) return;
  $('keyrows').innerHTML = KEY_ACTIONS.map(([act, label]) =>
    `<div class="krow"><span class="lab">${t(label)}</span><span class="chips">` +
    (K[act] || []).map((c, i) => `<span class="kc"><kbd>${esc(fmtHotkey(c))}</kbd><b data-act="${act}" data-i="${i}" title="${t('keys.remove')}">×</b></span>`).join('') +
    `<button class="btn add${capturing === act ? ' rec' : ''}" data-act="${act}">${capturing === act ? t('keys.press_btn') : '＋'}</button></span></div>`
  ).join('');
  $('quickmod').innerHTML = ['Ctrl', 'Alt', 'Shift', 'Super'].map((m) => `<option value="${m}">${QM_NAME[m]}</option>`).join('');
  $('quickmod').value = K.quick_mod; $('bare').checked = K.bare_digits;
  $('qsub').textContent = t('keys.quick_s', { ex: combo([K.quick_mod], '1') });
}
$('keyrows').addEventListener('click', (e) => {
  const rm = e.target.closest('b[data-act]');
  if (rm) {
    const act = rm.dataset.act;
    if ((act === 'choose' || act === 'close') && K[act].length <= 1) return keymsg(t('keys.min1'), true);
    K[act].splice(Number(rm.dataset.i), 1); capturing = null; drawKeys(); saveKeys(); return;
  }
  const add = e.target.closest('button.add');
  if (add) { capturing = capturing === add.dataset.act ? null : add.dataset.act; keymsg(capturing ? t('keys.press_msg') : ''); drawKeys(); }
});
document.addEventListener('keydown', (e) => {
  if (!capturing || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  if (e.code === 'Escape' && capturing !== 'close') { capturing = null; keymsg(''); drawKeys(); return; }
  const c = eventCombo(e);
  if (!c) return; // 修飾キーだけ・未対応のキー
  const bad = bindingProblem(c);
  if (bad) return keymsg(bad, true);
  for (const [a, label] of KEY_ACTIONS) if ((K[a] || []).includes(c)) return keymsg(t('keys.assigned', { key: fmtHotkey(c), action: t(label) }), true);
  K[capturing].push(c); capturing = null; drawKeys(); saveKeys();
}, true);
$('quickmod').addEventListener('change', () => { K.quick_mod = $('quickmod').value; drawKeys(); saveKeys(); });
$('bare').addEventListener('change', () => { K.bare_digits = $('bare').checked; saveKeys(); });
$('keyreset').addEventListener('click', () => { K = JSON.parse(JSON.stringify(DEFAULT_KEYS)); capturing = null; drawKeys(); saveKeys(); });

/* ---------- look ---------- */
let curTheme = 'auto';
function drawThemes() {
  $('themes').innerHTML = THEMES.map((th) => {
    const v = th.v;
    const sample = v
      ? `<div class="sample" style="background:${v.bg};color:${v.fg}"><div class="l1"><span class="dot" style="background:${v.accent}"></span>clp</div><div class="l2" style="background:${v.sel}">${t('theme.sample')}</div></div>`
      : `<div class="sample" style="background:linear-gradient(100deg,#fbfbfc 50%,#232326 50%);color:#888;text-align:center;padding-top:16px;font-size:13px">Auto</div>`;
    return `<div class="th${th.id === curTheme ? ' on' : ''}" data-id="${th.id}">${sample}${t('theme.' + th.id)}</div>`;
  }).join('');
}
$('themes').addEventListener('click', (e) => {
  const el = e.target.closest('.th'); if (!el) return;
  curTheme = el.dataset.id; applyTheme(curTheme); drawThemes();
  invoke('set_theme', { theme: curTheme });
});

/* ---------- history ---------- */
const setCount = (n) => { $('clrp').textContent = t('hist.clear_p', { n }); };
async function refreshCount() { setCount((await invoke('get_settings')).count); }
function saveLimits() {
  const mi = Math.max(50, Math.min(100000, Number($('maxitems').value) || 3000));
  const mk = Math.max(1, Math.min(20000, Number($('maxkb').value) || 1024));
  $('maxitems').value = mi; $('maxkb').value = mk;
  invoke('set_limits', { maxItems: mi, maxKb: mk }).then(() => { say($('limmsg'), t('common.saved')); refreshCount(); });
}
$('maxitems').addEventListener('change', saveLimits);
$('maxkb').addEventListener('change', saveLimits);
let clrTimer;
$('clear').addEventListener('click', async () => {
  if (!$('clear').dataset.arm) {
    $('clear').dataset.arm = 1; $('clear').textContent = t('hist.clear_arm');
    clrTimer = setTimeout(() => { delete $('clear').dataset.arm; $('clear').textContent = t('hist.clear_btn'); }, 3000);
    return;
  }
  clearTimeout(clrTimer); delete $('clear').dataset.arm; $('clear').textContent = t('hist.clear_btn');
  const n = await invoke('clear_history'); say($('clrmsg'), t('hist.cleared', { n })); refreshCount();
});
$('opendir').addEventListener('click', () => invoke('open_dir'));

/* ---------- excluded apps ---------- */
const drawExpHelp = () => { $('exptxt').textContent = t('hist.excl_p', { hint: t(IS_MAC ? 'hist.excl_hint_mac' : 'hist.excl_hint_win') }); };
const exLines = () => $('excl').value.split('\n').map((s) => s.trim()).filter(Boolean);
async function drawRecent() {
  const cur = new Set(exLines().map((s) => s.toLowerCase()));
  const rec = (await invoke('recent_apps')).filter((a) => !cur.has(a));
  $('recent').innerHTML = rec.length
    ? rec.map((a) => `<button class="btn" data-a="${a.replace(/"/g, '&quot;')}">+ ${a.replace(/</g, '&lt;')}</button>`).join('')
    : `<span style="opacity:.6">${t('hist.recent_none')}</span>`;
}
function saveExcl() {
  invoke('set_excludes', { list: exLines() }).then(() => { say($('exmsg'), t('common.saved')); drawRecent(); });
}
$('excl').addEventListener('change', saveExcl);
$('recent').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  $('excl').value = (exLines().concat(b.dataset.a)).join('\n'); saveExcl();
});
I18N_READY.then(() => invoke('get_excludes')).then((l) => { drawExpHelp(); $('excl').value = l.join('\n'); drawRecent(); });
window.addEventListener('focus', drawRecent);

/* ---------- update ---------- */
function showUpdate(u) {
  const dot = document.querySelector('nav button[data-p=about] .dot');
  if (u) {
    say($('updmsg'), t('about.has', { v: u.version }));
    $('upd').style.display = ''; $('upd').textContent = t('about.upd_to', { v: u.version });
    if (u.notes) { $('notes').textContent = u.notes; $('notes').style.display = ''; }
    dot.hidden = false;
  } else {
    say($('updmsg'), t('about.latest')); $('upd').style.display = 'none'; $('notes').style.display = 'none';
    dot.hidden = true;
  }
}
$('chk').addEventListener('click', async () => {
  say($('updmsg'), t('about.checking')); $('chk').disabled = true;
  try { showUpdate(await invoke('check_update')); } catch (err) { say($('updmsg'), String(err), true); }
  $('chk').disabled = false;
});
$('upd').addEventListener('click', async () => {
  $('upd').disabled = true; say($('updmsg'), t('about.updating'));
  try { await invoke('install_update'); } catch (err) { say($('updmsg'), String(err), true); $('upd').disabled = false; }
});
$('autochk').addEventListener('change', () => invoke('set_check_updates', { enabled: $('autochk').checked }));

/* ---------- backup ---------- */
$('exp').addEventListener('click', async () => {
  try { const p = await invoke('export_settings'); if (p) say($('bkmsg'), t('about.saved_to', { p })); }
  catch (err) { say($('bkmsg'), String(err), true); }
});
$('imp').addEventListener('click', async () => {
  if (!confirm(t('about.import_confirm'))) return;
  try {
    const m = await invoke('import_settings');
    if (m) { say($('bkmsg'), m); setTimeout(() => location.reload(), 1200); }
  } catch (err) { say($('bkmsg'), String(err), true); }
});

/* ---------- snippets ---------- */
const MAX_SNIP = 30;
let list = [], idx = 0, loaded = false, saveTimer = null, dirty = false, dragFrom = -1;

async function loadSnips() {
  if (dirty) return;
  try {
    list = await invoke('get_snippets'); $('sbanner').innerHTML = ''; loaded = true;
    if (idx >= list.length) idx = Math.max(0, list.length - 1);
    drawSnips();
  } catch (err) {
    loaded = false; list = [];
    $('sbanner').innerHTML = `<div class="banner">${esc(t('snip.err'))}\n${esc(String(err))}</div>` +
      `<button class="btn" id="sopen">${t('snip.open')}</button> <button class="btn" id="sreload">${t('snip.reload')}</button>`;
    $('sopen').onclick = () => invoke('open_snippets'); $('sreload').onclick = loadSnips;
    drawSnips();
  }
}

function drawSnips() {
  $('scount').textContent = `${list.length} / ${MAX_SNIP}`;
  $('sadd').disabled = !loaded || list.length >= MAX_SNIP;
  $('slist').innerHTML = list.length
    ? list.map((s, i) => `<div class="si${i === idx ? ' on' : ''}" draggable="true" data-i="${i}"><span class="n">${i < 10 ? (i + 1) % 10 : ''}</span>` +
        `<span class="t"><b>${esc(s.title) || t('snip.untitled')}</b><small>${esc(s.body.replace(/\s+/g, ' ')) || '&nbsp;'}</small></span></div>`).join('')
    : `<div class="empty">${loaded ? t('snip.empty') : ''}</div>`;
  drawEditor();
}

function drawEditor() {
  const s = list[idx];
  if (!s) { $('sed').innerHTML = ''; return; }
  $('sed').innerHTML =
    `<input type="text" id="stitle" placeholder="${esc(t('snip.ph_title'))}" value="${esc(s.title)}">` +
    `<textarea id="sbody" placeholder="${esc(t('snip.ph_body'))}" spellcheck="false"></textarea>` +
    `<div class="chips">${t('snip.vars')} ${['{date}', '{time}', '{datetime}', '{clipboard}'].map((v) => `<span class="chip" data-v="${v}">${v}</span>`).join('')}</div>` +
    `<div class="bar"><button class="btn" id="sup">${t('snip.up')}</button><button class="btn" id="sdown">${t('snip.down')}</button><button class="btn" id="sdup">${t('snip.dup')}</button>` +
    `<button class="btn danger" id="sdel" style="margin-left:auto">${t('snip.del')}</button></div>`;
  $('sbody').value = s.body;
  $('stitle').oninput = () => { list[idx].title = $('stitle').value; const b = $('slist').children[idx]; if (b) b.querySelector('b').textContent = list[idx].title || t('snip.untitled'); queueSave(); };
  $('sbody').oninput = () => { list[idx].body = $('sbody').value; const b = $('slist').children[idx]; if (b) b.querySelector('small').textContent = list[idx].body.replace(/\s+/g, ' ') || ' '; queueSave(); };
  $('sed').querySelectorAll('.chip').forEach((c) => c.onclick = () => {
    const t = $('sbody'), a = t.selectionStart, b = t.selectionEnd;
    t.setRangeText(c.dataset.v, a, b, 'end'); t.focus(); t.dispatchEvent(new Event('input'));
  });
  $('sup').onclick = () => move(idx, idx - 1);
  $('sdown').onclick = () => move(idx, idx + 1);
  $('sdup').onclick = () => { if (list.length < MAX_SNIP) { list.splice(idx + 1, 0, { ...list[idx], title: list[idx].title + ' ' + t('snip.copy') }); idx++; drawSnips(); queueSave(); } };
  let arm;
  $('sdel').onclick = () => {
    if (!arm) { arm = 1; $('sdel').textContent = t('snip.del_confirm'); setTimeout(() => { arm = 0; if ($('sdel')) $('sdel').textContent = t('snip.del'); }, 3000); return; }
    list.splice(idx, 1); idx = Math.max(0, Math.min(idx, list.length - 1)); drawSnips(); queueSave();
  };
}

function move(from, to) {
  if (to < 0 || to >= list.length || from === to) return;
  const [x] = list.splice(from, 1); list.splice(to, 0, x); idx = to; drawSnips(); queueSave();
}

$('slist').addEventListener('click', (e) => { const el = e.target.closest('.si'); if (el) { idx = Number(el.dataset.i); drawSnips(); } });
$('slist').addEventListener('dragstart', (e) => { const el = e.target.closest('.si'); if (el) { dragFrom = Number(el.dataset.i); e.dataTransfer.effectAllowed = 'move'; } });
$('slist').addEventListener('dragover', (e) => {
  e.preventDefault(); const el = e.target.closest('.si');
  document.querySelectorAll('.si.over').forEach((x) => x.classList.remove('over')); if (el) el.classList.add('over');
});
$('slist').addEventListener('drop', (e) => {
  e.preventDefault(); const el = e.target.closest('.si');
  if (el && dragFrom >= 0) move(dragFrom, Number(el.dataset.i)); dragFrom = -1; drawSnips();
});
$('sadd').addEventListener('click', () => {
  if (list.length >= MAX_SNIP) return;
  list.push({ title: t('snip.new'), body: '' }); idx = list.length - 1; drawSnips(); queueSave();
  $('stitle').focus(); $('stitle').select();
});

function queueSave() {
  dirty = true; say($('sstat'), t('snip.editing'));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await invoke('save_snippets', { list }); dirty = false; say($('sstat'), t('snip.saved')); }
    catch (err) { say($('sstat'), t('snip.fail', { e: err }), true); }
  }, 500);
}

window.addEventListener('focus', () => { if ($('p-snip').classList.contains('on')) loadSnips(); });

/* ---------- language ---------- */
async function initLang(cur) {
  const langs = await invoke('list_langs');
  $('lang').innerHTML = `<option value="auto">${esc(t('gen.lang_auto'))}</option>` + langs.map(([c, n]) => `<option value="${esc(c)}">${esc(n)}</option>`).join('');
  $('lang').value = cur || 'auto';
}
$('lang').addEventListener('change', async () => { await invoke('set_language', { language: $('lang').value }); location.reload(); });
$('opendir2').addEventListener('click', () => invoke('open_dir'));

/* ---------- init ---------- */
I18N_READY.then(() => invoke('get_settings')).then((s) => {
  S = s; document.title = t('set.title');
  initLang(s.language);
  $('hk').value = fmtHotkey(s.hotkey); $('auto').checked = s.autostart;
  $('hkreset').textContent = `${t('gen.reset')} (${fmtHotkey('Ctrl+Alt+V')})`;
  UI.closeOnBlur = s.close_on_blur; UI.fontSize = s.font_size;
  $('blur').checked = UI.closeOnBlur; $('fontsize').value = String(UI.fontSize);
  $('fxshadow').checked = s.shadow; $('fxglass').checked = s.glass;
  invoke('get_keys').then((k) => { K = { ...DEFAULT_KEYS, ...k }; drawKeys(); });
  curTheme = s.theme; applyTheme(curTheme); drawThemes();
  const r = document.querySelector(`input[name=pos][value=${s.position}]`); if (r) { r.checked = true; r.closest('label').classList.add('on'); }
  $('maxitems').value = s.max_items; $('maxkb').value = s.max_kb; setCount(s.count); $('dir').textContent = s.data_dir;
  $('verp').textContent = t('about.ver_p', { v: 'v' + s.version }); $('autochk').checked = s.check_updates;
  if (s.update_available) showUpdate({ version: s.update_available, notes: '' });
});
</script>
</body>
</html>
